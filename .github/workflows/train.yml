name: 每日交易日報

on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      FINMIND_MAX_WAIT: '240'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-

      - run: pip install -r requirements.txt

      - run: python -m trend.lab

      - name: 提交日報
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "交易日報 $(date +%F)"
          git push
